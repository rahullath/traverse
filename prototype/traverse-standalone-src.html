  <link rel="stylesheet" href="styles.css" />
  <style>
    /* host page: a quiet stage for the phone frame */
    html, body { margin: 0; padding: 0; min-height: 100%; background: #efece6; }
    body {
      font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
      color: #2a2620;
      display: flex; flex-direction: column;
      align-items: center;
      padding: 28px 16px 96px;
      box-sizing: border-box;
      min-height: 100vh;
    }
    .stage-cap {
      max-width: 760px;
      text-align: center;
      margin: 0 0 18px;
    }
    .stage-cap h1 {
      font-family: 'Newsreader', Georgia, serif;
      font-weight: 400;
      font-size: 22px;
      letter-spacing: -0.01em;
      margin: 0 0 6px;
      color: #1c1a16;
    }
    .stage-cap p {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic;
      font-size: 14px;
      color: #6a655c;
      margin: 0;
      max-width: 60ch;
      margin-left: auto; margin-right: auto;
    }
    .stage-cap small {
      display: block;
      margin-top: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 0.08em;
      color: #8c867c;
      text-transform: uppercase;
    }
    .phone-shell {
      filter: drop-shadow(0 30px 50px rgba(40, 30, 15, 0.13));
    }
  </style>
</head>
<body>
  <div class="stage-cap">
    <h1>traverse</h1>
    <p>A convivial, stateless tool for neurodivergent executive dysfunction. Paper-and-ink runtime. No streaks, no analytics, no retention loops.</p>
    <small>mirror v2 · prototype · open Tweaks for variations</small>
  </div>

  <div class="phone-shell">
    <div id="root"></div>
  </div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- iOS frame + tweaks panel -->
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Screens -->
  <script type="text/babel" src="screens/today.jsx"></script>
  <script type="text/babel" src="screens/plan.jsx"></script>
  <script type="text/babel" src="screens/empty.jsx"></script>
  <script type="text/babel" src="screens/onboarding.jsx"></script>
  <script type="text/babel" src="screens/clinical.jsx"></script>
  <script type="text/babel" src="screens/settings.jsx"></script>

  <!-- Mount: a single React tree wraps the app in an iOS device frame. -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
